[project]
name = "kitty-agent"
version = "0.1.0"
description = "On-site agent for ammarhassan.dev. FastAPI + LangGraph."
readme = "README.md"
# Upper bound is real: LangGraph does not support 3.14 yet, and without a cap
# pip will happily resolve onto it and fail deep in a native build.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Only these three, never the `langchain` umbrella package. The umbrella
    # drags in a tree big enough to matter against a serverless bundle limit,
    # and nothing here imports from it.
    "langgraph>=1.2",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.3",
    # zoneinfo has no tz database of its own on Windows, and python:3.12-slim
    # does not ship one either, so ZoneInfo("Asia/Karachi") raises without this.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
