name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No paths-ignore. This is a required check, and a path filtered skip leaves it
# pending forever, blocking the pull request with no obvious cause.
jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Match the Dockerfile, so this tests what ships.
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q

      # Tests exercise the app through the test client, which never binds a
      # port. This catches a boot failure the test client cannot see.
      - name: Service starts and answers /health
        run: |
          uvicorn app.main:app --port 8000 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "service answered /health"
              kill $pid
              exit 0
            fi
            sleep 0.5
          done
          echo "service did not answer /health within 15s"
          kill $pid 2>/dev/null || true
          exit 1
